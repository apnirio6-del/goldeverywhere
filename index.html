<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Everywhere — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#c79a32;--gold2:#a97918;--dark:#171717;--bg:#f5f3ef;--card:#fff;--muted:#777;--line:#e5dcc7;--danger:#b33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#222}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn{background:var(--gold);color:#fff}.btn.dark{background:#222}.btn.light{background:#eee;color:#222}.btn.danger{background:#a33;color:#fff}
nav{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
nav strong{color:#e2b94e;font-size:20px;margin-right:auto}nav button{background:#2b2b2b;color:#fff}nav button.active{background:var(--gold)}
main{max-width:1200px;margin:24px auto;padding:0 16px}.view{display:none}.view.active{display:block}
h1,h2{margin:0 0 16px}.gold{color:var(--gold2)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px #00000008}.metric b{font-size:26px;display:block;margin-top:7px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
label{font-size:12px;font-weight:700;color:#555;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8d0c0;border-radius:7px;background:#fff;font:inherit}textarea{min-height:70px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px;font-size:13px}th{background:#fbf6e8;color:var(--gold2)}td input{padding:6px;border:0;background:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.right{text-align:right}.muted{color:var(--muted);font-size:12px}
.toast{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:50}
.search{max-width:340px}.empty{text-align:center;padding:30px;color:#888}
.invoice-sheet{
  width:210mm;
  height:148mm;
  min-height:148mm;
  margin:0 auto;
  background:#fff;
  padding:8mm;
  position:relative;
  box-sizing:border-box;
  overflow:hidden;
};border:1px solid #d5ad52}
.invoice-sheet:before{content:"";position:absolute;inset:5mm;border:1px solid #d5ad52;pointer-events:none}.invoice-content{position:relative;z-index:1}
.inv-head{display:grid;grid-template-columns:1.1fr 1.7fr 1fr;gap:18px;align-items:start}.logo{font-weight:900;color:#b88720;font-size:34px;letter-spacing:3px;line-height:.9}.logo small{display:block;font-size:11px;letter-spacing:7px;margin-top:8px}
.inv-h1{margin:0;color:#b88720;font-family:Georgia,serif;font-size:38px;letter-spacing:3px}.line{height:1px;background:#d8b35d;margin:8px 0 14px}.inv-info{font-size:12px;line-height:1.8}.meta{text-align:right}.inv-table{margin-top:20px;font-size:11px}.inv-table th,.inv-table td{border:1px solid #d9c28d;padding:7px}.totals{margin-left:auto;margin-top:12px;width:42%}.totals td{padding:7px;border:1px solid #d9c28d}.totals tr:last-child{background:#c79a32;color:#fff;font-weight:bold}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:14px;font-size:11px}.center{text-align:center}.thanks{font-family:Georgia,serif;color:#a97918;font-size:16px;letter-spacing:3px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row,.row3{grid-template-columns:1fr}.invoice-sheet{width:100%;min-height:auto;overflow:auto}}
  }@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .invoice-sheet{
    margin:0;
    border:0;
    width:210mm;
    height:148mm;
    min-height:148mm;
    max-height:148mm;
    overflow:hidden;
  }
}

.auth-screen{min-height:100vh;background:#0b0b0b;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-logo{
  width:100px;
  height:auto;
  display:block;
  margin:0 auto 12px;
}
</head>
<body>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <img src="/ge-logo.png" class="auth-logo" alt="Gold Everywhere">
    <div class="auth-title">GOLD EVERYWHERE</div>
    <div class="auth-sub">Login Admin</div>
    <label>Email Admin</label>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="admin@email.com">
    <label>Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="authError" class="auth-error"></div>
    <button id="loginBtn" class="btn-login">🔐 MASUK</button>
  </div>
</section>
<nav class="no-print" id="appNav" style="display:none">
<strong style="display:flex;align-items:center;gap:8px"><img src="/ge-logo.png" alt="GE" style="width:34px;height:34px;object-fit:contain"> GE • GOLD EVERYWHERE</strong>
<button class="tab active" data-view="dashboard">Dashboard</button>
<button class="tab" data-view="kasir">Kasir / Invoice</button>
<button class="tab" data-view="riwayat">Riwayat</button>
<button class="tab" data-view="master">Master Data</button>
<button class="tab" data-view="backup">Backup</button><span id="userEmail" class="userbar"></span><button id="logoutBtn" class="logout">Keluar</button>
</nav>

<main class="no-print" id="appMain" style="display:none">
<section id="dashboard" class="view active">
<h1>Dashboard</h1>
<div class="grid">
<div class="card metric">Omzet Hari Ini<b id="mToday">Rp 0</b></div>
<div class="card metric">Transaksi Hari Ini<b id="mCount">0</b></div>
<div class="card metric">Total Gram Hari Ini<b id="mGram">0 g</b></div>
<div class="card metric">Semua Transaksi<b id="mAll">0</b></div>
</div>
<div class="panel" style="margin-top:18px"><h2>Transaksi Terbaru</h2><div id="recent"></div></div>
</section>

<section id="kasir" class="view">
<h1>Kasir / Invoice</h1>
<div class="panel">
<div class="row3">
<div><label>No. Invoice</label><input id="invNo" readonly></div>
<div><label>Tanggal</label><input id="invDate" type="date"></div>
<div><label>Metode Pembayaran</label><select id="payment"><option>TUNAI</option><option>TRANSFER</option><option>DEBIT/KREDIT</option><option>QRIS</option></select></div>
</div>
<div class="row" style="margin-top:14px">
<div><label>Nama Customer</label><input id="customerName" list="customerList" placeholder="Nama pelanggan"><datalist id="customerList"></datalist></div>
<div><label>No. HP</label><input id="customerPhone" placeholder="08xxxxxxxxxx"></div>
</div>
<div class="row" style="margin-top:14px">
<div><label>Alamat Customer</label><input id="customerAddress"></div>
<div><label>Catatan</label><input id="note"></div>
</div>
</div>

<div class="panel">
<h2>Barang</h2>
<table><thead><tr><th>No.</th><th>Nama Barang</th><th>Kadar</th><th>Berat (g)</th><th>Harga/g</th><th>Jumlah</th><th></th></tr></thead>
<tbody id="items"></tbody></table>
<div class="actions"><button class="btn" onclick="addItem()">+ Tambah Barang</button><button class="btn light" onclick="clearItems()">Kosongkan Barang</button></div>
</div>

<div class="panel">
<div class="row">
<div><label>Diskon (Rp)</label><input id="discount" type="number" min="0" value="0" oninput="recalc()"></div>
<div><label>Total Bayar</label><input id="grand" readonly></div>
</div>
<div class="actions">
<button class="btn" onclick="saveTransaction()">Simpan Transaksi</button>
<button class="btn dark" onclick="printInvoice()">Cetak / Simpan PDF A5</button>
<button class="btn light" onclick="newInvoice()">Transaksi Baru</button>
</div>
</div>
</section>

<section id="riwayat" class="view">
<h1>Riwayat Transaksi</h1>
<div class="panel">
<div class="actions"><input class="search" id="historySearch" placeholder="Cari invoice / nama customer / tanggal" oninput="renderHistory()"></div>
<div id="historyTable" style="margin-top:14px"></div>
</div>
</section>

<section id="master" class="view">
<h1>Master Data</h1>
<div class="row">
<div class="panel"><h2>Pelanggan</h2>
<div class="row"><input id="newCustName" placeholder="Nama"><input id="newCustPhone" placeholder="No. HP"></div>
<div class="actions"><button class="btn" onclick="addCustomer()">Tambah</button></div>
<div id="customers" style="margin-top:14px"></div>
</div>
<div class="panel"><h2>Produk / Harga</h2>
<div class="row"><input id="newProdName" placeholder="Nama barang"><input id="newProdPrice" type="number" placeholder="Harga / gram"></div>
<div class="row" style="margin-top:10px"><input id="newProdKarat" placeholder="Kadar, contoh 75%"><input id="newProdWeight" type="number" step="0.01" placeholder="Berat standar"></div>
<div class="actions"><button class="btn" onclick="addProduct()">Tambah</button></div>
<div id="products" style="margin-top:14px"></div>
</div>
</div>
</section>

<section id="backup" class="view">
<h1>Backup & Pengaturan</h1>
<div class="panel"><p class="muted">Data versi ini tersimpan di browser perangkat. Gunakan export untuk membuat cadangan sebelum pindah perangkat atau browser.</p>
<div class="actions"><button class="btn" onclick="exportData()">Export Backup JSON</button><button class="btn light" onclick="document.getElementById('importFile').click()">Import Backup JSON</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div>
<div class="panel"><h2>Informasi Toko</h2><div class="row"><input id="storeAddress" placeholder="Alamat toko"><input id="storePhone" placeholder="Nomor telepon"></div><div class="row" style="margin-top:10px"><input id="storeInstagram" placeholder="@instagram"><input id="storeName" placeholder="Nama toko"></div><div class="actions"><button class="btn" onclick="saveSettings()">Simpan Pengaturan</button></div></div>
</section>
</main>

<section id="printArea" style="display:none"></section>
<div id="toast" class="toast"></div>

<script>
const KEY='ge_system_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{transactions:[],customers:[],products:[],settings:{storeName:'GOLD EVERYWHERE',address:'',phone:'',instagram:''}};
let items=[];

const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const today=()=>new Date().toISOString().slice(0,10);
function persist(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function nextNo(){let d=today().replaceAll('-','');let nums=db.transactions.filter(x=>x.date===today()).map(x=>Number((x.invoice||'').split('/').pop())||0);let n=(Math.max(0,...nums)+1).toString().padStart(4,'0');return `INV/GE/${d}/${n}`}
function switchView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(id==='dashboard')renderDashboard();if(id==='riwayat')renderHistory();if(id==='master')renderMaster()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));

function addItem(x={name:'',karat:'',weight:'',price:0}){items.push({...x});renderItems()}
function renderItems(){let t=document.getElementById('items');t.innerHTML=items.map((x,i)=>`<tr><td>${i+1}</td><td><input value="${esc(x.name)}" onchange="items[${i}].name=this.value"></td><td><input value="${esc(x.karat)}" onchange="items[${i}].karat=this.value"></td><td><input type="number" step="0.01" value="${x.weight||''}" onchange="items[${i}].weight=this.value;recalc()"></td><td><input type="number" value="${x.price||0}" onchange="items[${i}].price=this.value;recalc()"></td><td>${rupiah((+x.weight||0)*(+x.price||0))}</td><td><button class="btn danger" onclick="items.splice(${i},1);renderItems();recalc()">×</button></td></tr>`).join('')}
function clearItems(){items=[];for(let i=0;i<3;i++)addItem();recalc()}
function recalc(){let total=items.reduce((s,x)=>s+(+x.weight||0)*(+x.price||0),0), disc=+document.getElementById('discount').value||0;document.getElementById('grand').value=rupiah(Math.max(0,total-disc));renderItems()}
function newInvoice(){document.getElementById('invNo').value=nextNo();document.getElementById('invDate').value=today();['customerName','customerPhone','customerAddress','note'].forEach(id=>document.getElementById(id).value='');document.getElementById('discount').value=0;items=[];for(let i=0;i<3;i++)addItem();recalc()}
function saveTransaction(){let total=items.reduce((s,x)=>s+(+x.weight||0)*(+x.price||0),0),disc=+document.getElementById('discount').value||0;if(!items.some(x=>(+x.weight||0)>0&&(+x.price||0)>0)){toast('Isi minimal satu barang dengan berat dan harga');return}let tx={id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),invoice:document.getElementById('invNo').value,date:document.getElementById('invDate').value,customer:{name:document.getElementById('customerName').value,phone:document.getElementById('customerPhone').value,address:document.getElementById('customerAddress').value},payment:document.getElementById('payment').value,note:document.getElementById('note').value,items:JSON.parse(JSON.stringify(items)),total,discount:disc,grand:Math.max(0,total-disc)};db.transactions.unshift(tx);if(tx.customer.name&&!db.customers.some(c=>c.name.toLowerCase()===tx.customer.name.toLowerCase()))db.customers.push(tx.customer);persist();updateLists();toast('Transaksi tersimpan');newInvoice();renderDashboard()}
function printInvoice(){let total=items.reduce((s,x)=>s+(+x.weight||0)*(+x.price||0),0),disc=+document.getElementById('discount').value||0,grand=Math.max(0,total-disc),weight=items.reduce((s,x)=>s+(+x.weight||0),0);let rows=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.karat)}</td><td>${x.weight||0}</td><td>${rupiah(x.price)}</td><td>${rupiah((+x.weight||0)*(+x.price||0))}</td></tr>`).join('');let s=db.settings;document.getElementById('printArea').innerHTML=`<div class="invoice-sheet"><div class="invoice-content"><div class="inv-head"><div><div class="logo">GE</div><div class="logo" style="font-size:28px;margin-top:6px">GOLD</div><div class="logo"><small>EVERYWHERE</small></div><div class="line"></div><div class="inv-info gold"><b>${esc(s.storeName||'GOLD EVERYWHERE')}</b></div><div class="inv-info">Toko Perhiasan Emas<br>${esc(s.address)}<br>Telp. ${esc(s.phone)}<br>Instagram ${esc(s.instagram)}</div></div><div class="inv-info"><b class="gold">KEPADA YTH.</b><br>${esc(document.getElementById('customerName').value)}<br>${esc(document.getElementById('customerAddress').value)}<br>${esc(document.getElementById('customerPhone').value)}</div><div class="meta"><h1 class="inv-h1">INVOICE</h1><div class="line"></div><div class="inv-info">No. ${esc(document.getElementById('invNo').value)}<br>Tanggal ${esc(document.getElementById('invDate').value)}</div></div></div><table class="inv-table"><thead><tr><th>NO.</th><th>NAMA BARANG</th><th>KADAR</th><th>BERAT (GRAM)</th><th>HARGA / GRAM</th><th>JUMLAH</th></tr></thead><tbody>${rows}</tbody></table><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div class="inv-info" style="margin-top:14px"><b class="gold">CATATAN:</b><br>${esc(document.getElementById('note').value)}<br><br>Metode: ${esc(document.getElementById('payment').value)}</div><table class="totals"><tr><td>TOTAL BERAT</td><td>${weight.toFixed(2)} g</td></tr><tr><td>TOTAL HARGA</td><td>${rupiah(total)}</td></tr><tr><td>DISKON</td><td>${rupiah(disc)}</td></tr><tr><td>TOTAL BAYAR</td><td>${rupiah(grand)}</td></tr></table></div><div class="bottom"><div><b class="gold">METODE PEMBAYARAN</b><br><br>TUNAI | TRANSFER | DEBIT/KREDIT | QRIS</div><div class="center"><div class="thanks">TERIMA KASIH</div><br>Atas kepercayaan Anda berbelanja di Gold Everywhere.</div><div class="center gold">GOLD IS MORE THAN JEWELRY,<br>IT'S A LIFETIME VALUE.</div></div></div></div>`;document.body.classList.add('printing');let old=document.querySelector('main').style.display, nav=document.querySelector('nav').style.display;document.querySelector('nav').style.display='none';document.querySelector('main').style.display='none';document.getElementById('printArea').style.display='block';window.print();setTimeout(()=>{document.querySelector('nav').style.display=nav;document.querySelector('main').style.display=old;document.getElementById('printArea').style.display='none'},500)}
function renderDashboard(){let t=today(),tx=db.transactions.filter(x=>x.date===t);document.getElementById('mToday').textContent=rupiah(tx.reduce((s,x)=>s+x.grand,0));document.getElementById('mCount').textContent=tx.length;document.getElementById('mGram').textContent=tx.reduce((s,x)=>s+x.items.reduce((a,i)=>a+(+i.weight||0),0),0).toFixed(2)+' g';document.getElementById('mAll').textContent=db.transactions.length;document.getElementById('recent').innerHTML=db.transactions.slice(0,8).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${esc(x.invoice)}</b> — ${esc(x.customer.name||'-')} <span style="float:right">${rupiah(x.grand)}</span><div class="muted">${x.date} • ${x.payment}</div></div>`).join('')||'<div class="empty">Belum ada transaksi.</div>'}
function renderHistory(){let q=(document.getElementById('historySearch').value||'').toLowerCase();let a=db.transactions.filter(x=>(x.invoice+' '+x.date+' '+x.customer.name).toLowerCase().includes(q));document.getElementById('historyTable').innerHTML=a.length?`<table><thead><tr><th>Invoice</th><th>Tanggal</th><th>Customer</th><th>Pembayaran</th><th>Total</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.invoice)}</td><td>${x.date}</td><td>${esc(x.customer.name||'-')}</td><td>${x.payment}</td><td>${rupiah(x.grand)}</td><td><button class="btn light" onclick="loadTx('${x.id}')">Buka</button> <button class="btn danger" onclick="deleteTx('${x.id}')">Hapus</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Tidak ada transaksi.</div>'}
function loadTx(id){let x=db.transactions.find(t=>t.id===id);if(!x)return;switchView('kasir');document.getElementById('invNo').value=x.invoice;document.getElementById('invDate').value=x.date;document.getElementById('customerName').value=x.customer.name;document.getElementById('customerPhone').value=x.customer.phone||'';document.getElementById('customerAddress').value=x.customer.address||'';document.getElementById('payment').value=x.payment;document.getElementById('note').value=x.note||'';document.getElementById('discount').value=x.discount;items=JSON.parse(JSON.stringify(x.items));renderItems();recalc()}
function deleteTx(id){if(confirm('Hapus transaksi ini?')){db.transactions=db.transactions.filter(x=>x.id!==id);persist();renderHistory();renderDashboard()}}
function addCustomer(){let n=document.getElementById('newCustName').value.trim();if(!n)return;db.customers.push({name:n,phone:document.getElementById('newCustPhone').value});persist();document.getElementById('newCustName').value='';document.getElementById('newCustPhone').value='';renderMaster();updateLists()}
function addProduct(){let n=document.getElementById('newProdName').value.trim();if(!n)return;db.products.push({name:n,price:+document.getElementById('newProdPrice').value||0,karat:document.getElementById('newProdKarat').value,weight:+document.getElementById('newProdWeight').value||0});persist();renderMaster()}
function renderMaster(){document.getElementById('customers').innerHTML=db.customers.map((c,i)=>`<div style="padding:8px;border-bottom:1px solid #eee">${esc(c.name)} <span class="muted">${esc(c.phone||'')}</span></div>`).join('')||'<div class="empty">Belum ada pelanggan.</div>';document.getElementById('products').innerHTML=db.products.map((p,i)=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${esc(p.name)}</b> — ${p.karat||'-'} — ${rupiah(p.price)}/g</div>`).join('')||'<div class="empty">Belum ada produk.</div>'}
function updateLists(){document.getElementById('customerList').innerHTML=db.customers.map(c=>`<option value="${esc(c.name)}">${esc(c.phone||'')}</option>`).join('')}
function saveSettings(){db.settings={storeName:document.getElementById('storeName').value,address:document.getElementById('storeAddress').value,phone:document.getElementById('storePhone').value,instagram:document.getElementById('storeInstagram').value};persist();toast('Pengaturan disimpan')}
function loadSettings(){let s=db.settings;document.getElementById('storeName').value=s.storeName||'';document.getElementById('storeAddress').value=s.address||'';document.getElementById('storePhone').value=s.phone||'';document.getElementById('storeInstagram').value=s.instagram||''}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gold-everywhere-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.transactions||!x.settings)throw Error();db=x;persist();location.reload()}catch{alert('File backup tidak valid.')}};r.readAsText(f)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function initAuth(){
  const screen=document.getElementById('authScreen'), nav=document.getElementById('appNav'), main=document.getElementById('appMain');
  const err=document.getElementById('authError'); const btn=document.getElementById('loginBtn');
  let client;
  try{
    const r=await fetch('/api/config'); const cfg=await r.json();
    if(!cfg.url||!cfg.anonKey) throw new Error('Konfigurasi Supabase belum lengkap di Netlify.');
    client=window.supabase.createClient(cfg.url,cfg.anonKey);
  }catch(e){err.textContent=e.message;return;}
  async function show(session){
    if(session){screen.style.display='none';nav.style.display='flex';main.style.display='block';document.getElementById('userEmail').textContent=session.user?.email||'';loadSettings();updateLists();newInvoice();renderDashboard();}
    else{screen.style.display='flex';nav.style.display='none';main.style.display='none';}
  }
  const {data:{session}}=await client.auth.getSession(); await show(session);
  client.auth.onAuthStateChange((_event,s)=>{show(s)});
  btn.onclick=async()=>{err.textContent='';btn.disabled=true;btn.textContent='Memproses...';const {error}=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error)err.textContent='Email atau password salah.';btn.disabled=false;btn.textContent='🔐 MASUK';};
  document.getElementById('logoutBtn').onclick=async()=>{await client.auth.signOut();};
}
initAuth();
</script>
</body>
</html>
